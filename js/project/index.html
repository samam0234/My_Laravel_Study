<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Laravel Study · 학습 서재 JavaScript</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main>
      <section class="card">
        <p class="eyebrow">js/project · studyFinal</p>
        <h1>학습 서재</h1>
        <p>이 화면은 Blade가 아닙니다. <code>http://127.0.0.1:8001</code>의 노트 API만 부릅니다. 샘플 계정 <code>mina@example.com</code> / <code>password123</code>은 로컬 학습용입니다.</p>
        <p id="status"></p>
        <form id="login">
          <label>이메일 <input name="email" type="email" autocomplete="username" value="mina@example.com" required></label>
          <label>비밀번호 <input name="password" type="password" autocomplete="current-password" value="password123" required></label>
          <div class="row">
            <button type="submit">로그인</button>
            <button type="button" id="logout">로그아웃</button>
          </div>
        </form>
        <form id="search" class="row">
          <input name="q" placeholder="제목 또는 본문">
          <input name="tag" placeholder="태그">
          <button type="submit">찾기</button>
        </form>
        <div id="tags"></div>
        <p id="meta"></p>
        <div id="notes"></div>
        <p class="row">
          <button type="button" id="prev">이전</button>
          <button type="button" id="next">다음</button>
        </p>
        <form id="new-note">
          <h2>새 노트</h2>
          <label>제목 <input name="title" required></label>
          <label>내용 <textarea name="body" required></textarea></label>
          <label>태그 <input name="tags" placeholder="쉼표로 구분"></label>
          <button type="submit">저장</button>
        </form>
        <section id="detail" hidden>
          <h2 id="detail-title"></h2>
          <p id="detail-body"></p>
          <p id="detail-author" class="muted"></p>
          <p id="detail-tags" class="muted"></p>
        </section>
      </section>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
